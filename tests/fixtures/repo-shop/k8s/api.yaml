apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  template:
    metadata:
      labels:
        app: shop-api
    spec:
      containers:
        - name: api
          image: ghcr.io/acme/api:1.4.0
          env:
            - name: REDIS_HOST
              value: cache-svc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
spec:
  template:
    metadata:
      labels:
        app: shop-cache
    spec:
      containers:
        - name: redis
          image: redis:7
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
spec:
  selector:
    app: shop-api
---
apiVersion: v1
kind: Service
metadata:
  name: cache-svc
spec:
  selector:
    app: shop-cache
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
spec:
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /api
            backend:
              service:
                name: api-svc
