name: Experience dependency snapshot
on:
  push:
    branches: [feat/diagramcloud-experience-pro-pass]
    paths: [.github/workflows/experience-dependency-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-fund --no-audit
      - run: tar --exclude='*.woff' --exclude='*.woff2' --exclude='*.ttf' --exclude='*.otf' -czf experience-dependencies.tgz node_modules package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: experience-dependencies
          path: experience-dependencies.tgz
          retention-days: 1
