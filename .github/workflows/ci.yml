name: DiagramCloud CI
on:
  push:
    branches: [main, 'feat/diagramcloud-*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: diagramcloud-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Test the pull request's head commit, not GitHub's temporary merge commit, so the receipt names the code that ran.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-fund --no-audit
      - name: Typecheck
        id: typecheck
        run: npm run check
      - name: Unit tests
        id: unit
        run: npm test
      - name: Standalone CLI and MCP bundles
        run: |
          mkdir -p release
          npx tsx scripts/qualify-clients.ts --out release/bundled-client-qualification
      - name: Build
        id: build
        run: npm run build
      - name: Browser tests
        id: e2e
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - name: Verification receipt
        if: always()
        run: npx tsx scripts/qualify.ts record typecheck=${{ steps.typecheck.outcome }} unit=${{ steps.unit.outcome }} build=${{ steps.build.outcome }} e2e=${{ steps.e2e.outcome }}
      - name: Package source and build
        if: always()
        run: |
          mkdir -p release
          npm ls --depth=0 --json > release/dependency-versions.json || true
          git rev-parse HEAD > release/SOURCE_COMMIT.txt
          tar --exclude=.git --exclude=node_modules --exclude=release --exclude=test-results --exclude=playwright-report -czf release/diagramcloud-source-and-build.tar.gz .
          sha256sum release/diagramcloud-source-and-build.tar.gz > release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagramcloud-ci
          path: |
            release/
            playwright-report/
            test-results/
          retention-days: 14
