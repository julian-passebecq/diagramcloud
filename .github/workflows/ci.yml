name: DiagramCloud V1
on:
  push:
    branches: [main, feat/diagramcloud-v1]
  pull_request:
permissions:
  contents: read
concurrency:
  group: diagramcloud-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        if: hashFiles('package.json') != ''
        run: npm install --no-fund --no-audit
      - name: Validate and build
        if: hashFiles('package.json') != ''
        run: npm run check && npm test && npm run build
      - name: Browser tests
        if: hashFiles('package.json') != ''
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - name: Package source and build
        if: hashFiles('package.json') != ''
        run: |
          mkdir -p release
          tar --exclude=.git --exclude=node_modules --exclude=release --exclude=test-results --exclude=playwright-report -czf release/diagramcloud-v1-source-and-build.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('package.json') != ''
        with:
          name: diagramcloud-v1
          path: |
            release/
            playwright-report/
            test-results/
          retention-days: 14
