name: DiagramCloud V1
on:
  push:
    branches: [main, feat/diagramcloud-v1]
  pull_request:
permissions:
  contents: read
concurrency:
  group: diagramcloud-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-fund --no-audit
      - name: Typecheck
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Browser tests
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - name: Package source and build
        if: always()
        run: |
          mkdir -p release
          npm ls --depth=0 --json > release/dependency-versions.json || true
          git rev-parse HEAD > release/SOURCE_COMMIT.txt
          tar --exclude=.git --exclude=node_modules --exclude=release --exclude=test-results --exclude=playwright-report -czf release/diagramcloud-v1-source-and-build.tar.gz .
          sha256sum release/diagramcloud-v1-source-and-build.tar.gz > release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagramcloud-v1
          path: |
            release/
            playwright-report/
            test-results/
          retention-days: 14
