<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="520" height="520" font-family="system-ui,sans-serif" font-size="13">
  <title>Flowchart</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#6b7280"/></marker></defs>
  <rect width="520" height="520" fill="#fbfaf7"/>
  <text x="20" y="28" font-size="11" letter-spacing="1.5" fill="#6b7280">FLOWCHART · TEMPLATE</text>
  <g id="arrows" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <title>Arrows</title>
    <path d="M200 92V126"/><path d="M200 182V214"/><path d="M200 310V344"/><path d="M270 262H360V344"/><path d="M200 400V434"/><path d="M360 400V462H262"/>
  </g>
  <g id="start"><title>Start</title><rect x="140" y="52" width="120" height="40" rx="20" fill="#fff" stroke="#1f2937"/><text x="200" y="77" text-anchor="middle">Start</text></g>
  <g id="step-1"><title>Step 1</title><rect x="120" y="126" width="160" height="56" rx="4" fill="#fff" stroke="#1f2937"/><text x="200" y="159" text-anchor="middle">Step 1</text></g>
  <g id="decision"><title>Decision?</title><path d="M200 214 270 262 200 310 130 262z" fill="#f3efe6" stroke="#b45309"/><text x="200" y="267" text-anchor="middle">Decision?</text></g>
  <text x="208" y="330" font-size="11" fill="#6b7280">yes</text><text x="300" y="254" font-size="11" fill="#6b7280">no</text>
  <g id="step-2"><title>Step 2</title><rect x="120" y="344" width="160" height="56" rx="4" fill="#fff" stroke="#1f2937"/><text x="200" y="377" text-anchor="middle">Step 2</text></g>
  <g id="alternative"><title>Alternative</title><rect x="290" y="344" width="140" height="56" rx="4" fill="#fff" stroke="#1f2937"/><text x="360" y="377" text-anchor="middle">Alternative</text></g>
  <g id="end"><title>End</title><rect x="140" y="434" width="120" height="40" rx="20" fill="#fff" stroke="#1f2937"/><text x="200" y="459" text-anchor="middle">End</text></g>
</svg>
