  <text x="20" y="28" font-size="11" letter-spacing="1.5" fill="#6b7280">FLOOR PLAN · TEMPLATE</text>
  <g fill="#fff" stroke="#1f2937" stroke-width="4">
    <g id="room-1"><title>Room 1</title><rect x="20" y="44" width="340" height="200"/><text x="190" y="148" text-anchor="middle" stroke="none" fill="#1f2937">Room 1</text></g>
    <g id="room-2"><title>Room 2</title><rect x="360" y="44" width="260" height="200"/><text x="490" y="148" text-anchor="middle" stroke="none" fill="#1f2937">Room 2</text></g>
    <g id="room-3"><title>Room 3</title><rect x="20" y="244" width="260" height="140"/><text x="150" y="318" text-anchor="middle" stroke="none" fill="#1f2937">Room 3</text></g>
